<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
    <defs>
      <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#1e293b"/>
        <stop offset="100%" stop-color="#334155"/>
      </linearGradient>
      <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#475569"/>
        <stop offset="100%" stop-color="#1e293b"/>
      </linearGradient>
      <linearGradient id="boardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#0f172a"/>
        <stop offset="100%" stop-color="#1e293b"/>
      </linearGradient>
      <linearGradient id="deskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#d97706"/>
        <stop offset="100%" stop-color="#b45309"/>
      </linearGradient>
      <filter id="cctvGlow">
        <feGaussianBlur stdDeviation="1" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>

    <!-- Background Classroom Room Geometry -->
    <!-- Front Wall -->
    <rect x="0" y="0" width="1280" height="240" fill="url(#wallGrad)"/>
    <!-- Floor in CCTV Perspective -->
    <polygon points="0,240 1280,240 1280,720 0,720" fill="url(#floorGrad)"/>
    
    <!-- Floor Tiles Grid Lines (Perspective) -->
    <line x1="0" y1="360" x2="1280" y2="360" stroke="#334155" stroke-width="1.5" opacity="0.4"/>
    <line x1="0" y1="500" x2="1280" y2="500" stroke="#334155" stroke-width="2" opacity="0.4"/>
    <line x1="0" y1="640" x2="1280" y2="640" stroke="#334155" stroke-width="2.5" opacity="0.4"/>
    <line x1="200" y1="240" x2="50" y2="720" stroke="#334155" stroke-width="2" opacity="0.3"/>
    <line x1="440" y1="240" x2="350" y2="720" stroke="#334155" stroke-width="2" opacity="0.3"/>
    <line x1="640" y1="240" x2="640" y2="720" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.35"/>
    <line x1="840" y1="240" x2="930" y2="720" stroke="#334155" stroke-width="2" opacity="0.3"/>
    <line x1="1080" y1="240" x2="1230" y2="720" stroke="#334155" stroke-width="2" opacity="0.3"/>

    <!-- Ceiling Fluorescent Lights -->
    <rect x="260" y="10" width="280" height="24" rx="4" fill="#f8fafc" opacity="0.85"/>
    <rect x="740" y="10" width="280" height="24" rx="4" fill="#f8fafc" opacity="0.85"/>

    <!-- Blackboard / Whiteboard in front of class -->
    <rect x="360" y="50" width="560" height="150" rx="8" fill="url(#boardGrad)" stroke="#475569" stroke-width="4"/>
    <text x="640" y="90" fill="#38bdf8" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">UNIVERSITY EXAMINATIONS 2026</text>
    <text x="640" y="125" fill="#f1f5f9" font-family="sans-serif" font-size="16" text-anchor="middle">EXAM HALL A • COMPUTER VISION &amp; AI SECURITY</text>
    <text x="640" y="155" fill="#94a3b8" font-family="sans-serif" font-size="13" text-anchor="middle">SESSION TIME: 09:00 - 12:00 | CCTV CAM-01 SECURED</text>
    <text x="640" y="180" fill="#f59e0b" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">⚠️ SILENCE • NO MOBILE DEVICES • CCTV SURVEILLANCE ACTIVE</text>

    <!-- Analog Wall Clock -->
    <circle cx="1060" cy="110" r="38" fill="#f8fafc" stroke="#334155" stroke-width="4"/>
    <circle cx="1060" cy="110" r="3" fill="#0f172a"/>
    <line x1="1060" y1="110" x2="1060" y2="85" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
    <line x1="1060" y1="110" x2="1078" y2="110" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="1060" y1="110" x2="1060" y2="82" stroke="#ef4444" stroke-width="1.5"/>

    <!-- Central Aisle Proctor / Invigilator Walking -->
    <g transform="translate(640, 320)">
      <!-- Shadow -->
      <ellipse cx="0" cy="55" rx="30" ry="12" fill="#020617" opacity="0.4"/>
      <!-- Body -->
      <rect x="-18" y="0" width="36" height="52" rx="8" fill="#1e1b4b"/>
      <!-- Head -->
      <circle cx="0" cy="-14" r="15" fill="#fcd34d"/>
      <!-- Hair -->
      <path d="M-15,-18 Q0,-32 15,-18 Q14,-26 0,-28 Q-14,-26 -15,-18" fill="#18181b"/>
      <!-- ID Badge Lanyard -->
      <path d="M-6,0 L0,18 L6,0" stroke="#3b82f6" stroke-width="2" fill="none"/>
      <rect x="-8" y="18" width="16" height="12" rx="2" fill="#f8fafc" stroke="#3b82f6" stroke-width="1"/>
      <rect x="-6" y="21" width="12" height="3" fill="#ef4444"/>
    </g>

    <!-- Student Desks & Students Function -->
    <!-- Row 1: Left (Seat A1) -->
    <g transform="translate(240, 310)">
      <ellipse cx="0" cy="45" rx="75" ry="20" fill="#0f172a" opacity="0.5"/>
      <!-- Chair -->
      <rect x="-24" y="-35" width="48" height="30" rx="6" fill="#334155"/>
      <!-- Student 1 -->
      <circle cx="0" cy="-28" r="18" fill="#fbcfe8"/>
      <path d="M-16,-32 Q0,-45 16,-32 Q15,-40 0,-42 Q-15,-40 -16,-32" fill="#3f3f46"/>
      <rect x="-22" y="-10" width="44" height="42" rx="8" fill="#2563eb"/>
      <!-- Arms & Hand writing -->
      <path d="M-18,5 Q-10,25 0,22" stroke="#fbcfe8" stroke-width="7" stroke-linecap="round" fill="none"/>
      <!-- Desk -->
      <polygon points="-80,25 80,25 90,65 -90,65" fill="url(#deskGrad)" stroke="#78350f" stroke-width="2"/>
      <!-- Paper & Pen -->
      <rect x="-30" y="32" width="40" height="26" fill="#ffffff" rx="2" transform="rotate(-4)"/>
      <line x1="0" y1="42" x2="12" y2="38" stroke="#1e293b" stroke-width="2"/>
      <text x="-75" y="55" fill="#fef3c7" font-family="monospace" font-size="11" font-weight="bold">SEAT A1</text>
    </g>

    <!-- Row 1: Right (Seat A2) -->
    <g transform="translate(1040, 310)">
      <ellipse cx="0" cy="45" rx="75" ry="20" fill="#0f172a" opacity="0.5"/>
      <rect x="-24" y="-35" width="48" height="30" rx="6" fill="#334155"/>
      <!-- Student 2 -->
      <circle cx="0" cy="-28" r="18" fill="#fed7aa"/>
      <path d="M-16,-30 Q0,-45 16,-30" fill="#713f12" stroke="#713f12" stroke-width="6"/>
      <rect x="-22" y="-10" width="44" height="42" rx="8" fill="#059669"/>
      <polygon points="-80,25 80,25 90,65 -90,65" fill="url(#deskGrad)" stroke="#78350f" stroke-width="2"/>
      <rect x="-20" y="32" width="40" height="26" fill="#ffffff" rx="2" transform="rotate(3)"/>
      <text x="-75" y="55" fill="#fef3c7" font-family="monospace" font-size="11" font-weight="bold">SEAT A2</text>
    </g>

    <!-- Row 2: Left (Seat B1) - Suspicious Student turning head -->
    <g transform="translate(210, 480)">
      <ellipse cx="0" cy="55" rx="90" ry="24" fill="#0f172a" opacity="0.55"/>
      <rect x="-30" y="-42" width="60" height="38" rx="8" fill="#334155"/>
      <!-- Body -->
      <rect x="-28" y="-12" width="56" height="52" rx="10" fill="#dc2626"/>
      <!-- Head with dynamic turning angle! -->
      <g transform="rotate(0, 0, -32)">
        <circle cx="0" cy="-32" r="22" fill="#fde047"/>
        <path d="M-18,-38 Q0,-54 18,-38 Q18,-48 0,-50 Q-18,-48 -18,-38" fill="#18181b"/>
        <!-- Eyes looking right -->
        <circle cx="6" cy="-32" r="3" fill="#0f172a"/>
        <circle cx="14" cy="-32" r="3" fill="#0f172a"/>
      </g>
      <!-- Desk -->
      <polygon points="-100,30 100,30 115,80 -115,80" fill="url(#deskGrad)" stroke="#78350f" stroke-width="2"/>
      <rect x="-35" y="38" width="50" height="32" fill="#ffffff" rx="2" transform="rotate(-6)"/>
      <text x="-95" y="68" fill="#fef3c7" font-family="monospace" font-size="13" font-weight="bold">SEAT B1</text>
    </g>

    <!-- Row 2: Right (Seat B2) -->
    <g transform="translate(1070, 480)">
      <ellipse cx="0" cy="55" rx="90" ry="24" fill="#0f172a" opacity="0.55"/>
      <rect x="-30" y="-42" width="60" height="38" rx="8" fill="#334155"/>
      <circle cx="0" cy="-32" r="22" fill="#fed7aa"/>
      <path d="M-20,-36 Q0,-54 20,-36" fill="#18181b" stroke="#18181b" stroke-width="8"/>
      <rect x="-28" y="-12" width="56" height="52" rx="10" fill="#475569"/>
      <path d="M-22,8 Q-10,32 6,28" stroke="#fed7aa" stroke-width="9" stroke-linecap="round" fill="none"/>
      <polygon points="-100,30 100,30 115,80 -115,80" fill="url(#deskGrad)" stroke="#78350f" stroke-width="2"/>
      <rect x="-25" y="38" width="50" height="32" fill="#ffffff" rx="2" transform="rotate(4)"/>
      <text x="-95" y="68" fill="#fef3c7" font-family="monospace" font-size="13" font-weight="bold">SEAT B2</text>
    </g>

    <!-- CCTV Camera Overlay (On Screen Display) -->
    <!-- Top Left Camera ID -->
    <rect x="24" y="24" width="340" height="36" rx="6" fill="#020617" opacity="0.8" stroke="#334155" stroke-width="1.5"/>
    <text x="36" y="48" fill="#22c55e" font-family="monospace" font-size="14" font-weight="bold" filter="url(#cctvGlow)">● CAM-01 [HALL-A] OPTICAL 1080p</text>

    <!-- Top Right REC and Clock -->
    <rect x="920" y="24" width="336" height="36" rx="6" fill="#020617" opacity="0.8" stroke="#334155" stroke-width="1.5"/>
    <circle cx="942" cy="42" r="6" fill="#ef4444"/>
    <text x="958" y="48" fill="#f8fafc" font-family="monospace" font-size="14" font-weight="bold">REC  2026-09-20 11:45:20.00</text>

    <!-- Bottom Info Bar -->
    <rect x="24" y="666" width="480" height="30" rx="4" fill="#020617" opacity="0.75"/>
    <text x="36" y="686" fill="#94a3b8" font-family="monospace" font-size="12">FPS: 15.0 | AI SURVEILLANCE ACTIVE | ISO 400 1/50s</text>
  </svg>